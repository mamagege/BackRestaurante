# Configuración base. Todo valor sensible o dependiente del ambiente llega por variable
# de entorno; los valores por defecto sirven para desarrollo local con run-db.ps1 o
# docker compose (ver .env.example).
spring:
  application:
    name: restaurante
  config:
    import: optional:file:.env[.properties]

  # PostgreSQL (datos transaccionales)
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:restaurante}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: ${SHOW_SQL:false}

  # MongoDB (auditoría). En QA/PROD se sobreescribe con SPRING_DATA_MONGODB_URI
  data:
    mongodb:
      uri: mongodb://${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DB:restaurante}

# JWT: el secreto llega SOLO por variable de entorno (ver .env.example)
jwt:
  secret: ${JWT_SECRET:}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

app:
  # Usuarios de prueba: solo para desarrollo local (SEED_ENABLED=true)
  seed:
    enabled: ${SEED_ENABLED:false}
  # Orígenes del front autorizados por CORS, separados por coma
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

server:
  port: ${SERVER_PORT:8080}
  # HTTPS opcional: en Azure lo termina el App Service; localmente SSL_ENABLED=true + restaurante.p12
  ssl:
    enabled: ${SSL_ENABLED:false}
    key-store: classpath:restaurante.p12
    key-store-password: ${SSL_KEYSTORE_PASSWORD:}
    key-store-type: PKCS12
    key-alias: restaurante

logging:
  level:
    root: INFO
    com.dows.bitacora2.restaurante: ${LOG_LEVEL:INFO}
    org.springframework.web: WARN
